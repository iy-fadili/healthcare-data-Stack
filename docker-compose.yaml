services:
  postgres:
    image: postgres:15
    container_name: healthcare_data_stack_postgres
    environment:
      POSTGRES_USER: data_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - healthcare_data_stack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_user -d clinic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  healthcare_data_stack_pgdata:
